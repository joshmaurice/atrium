<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Atrium</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #111;
    color: #e2e8f0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Toolbar ───────────────────────────────────────── */
  .toolbar {
    background: #1e1e1e;
    border-bottom: 1px solid #333;
    padding: 7px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .toolbar h1 {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: #a78bfa;
    flex-shrink: 0;
  }

  .toolbar input[type="text"] {
    flex: 1;
    background: #111;
    border: 1px solid #333;
    border-radius: 4px;
    color: #e2e8f0;
    padding: 5px 10px;
    font-size: 13px;
  }
  .toolbar input[type="text"]:focus,
  .toolbar input[type="password"]:focus { outline: none; border-color: #a78bfa; }

  .toolbar input[type="password"] {
    background: #111;
    border: 1px solid #333;
    border-radius: 4px;
    color: #e2e8f0;
    padding: 5px 10px;
    font-size: 13px;
  }

  .toolbar .ws-label {
    font-size: 12px;
    color: #64748b;
    flex-shrink: 0;
  }

  button {
    background: #2d2d2d;
    border: 1px solid #444;
    border-radius: 4px;
    color: #e2e8f0;
    padding: 5px 12px;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.1s;
    flex-shrink: 0;
  }
  button:hover:not(:disabled) { background: #3a3a3a; }
  button:disabled { opacity: 0.4; cursor: default; }
  button.primary { background: #5b21b6; border-color: #7c3aed; }
  button.primary:hover:not(:disabled) { background: #6d28d9; }
  button.text-btn { background: none; border: none; color: #a78bfa; font-size: 11px; padding: 5px; }
  button.text-btn:hover { color: #c4b5fd; }
  button.danger { border-color: #dc2626; color: #fca5a5; }
  button.danger:hover:not(:disabled) { background: #450a0a; }

  .toolbar select {
    background: #2d2d2d;
    border: 1px solid #444;
    border-radius: 4px;
    color: #e2e8f0;
    padding: 5px 8px;
    font-size: 12px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .toolbar select:focus { outline: none; border-color: #a78bfa; }

  /* Toolbar separator */
  .toolbar-sep {
    width: 1px;
    height: 24px;
    background: #333;
    flex-shrink: 0;
  }

  /* Auth error message */
  #auth-error {
    font-size: 11px;
    color: #f87171;
    max-width: 200px;
    flex-shrink: 0;
  }
  #auth-error:empty { display: none; }

  /* Auth logged-in label */
  #auth-user-label {
    font-size: 12px;
    color: #a78bfa;
    flex-shrink: 0;
  }

  /* Status dot */
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #888;
    flex-shrink: 0;
  }
  .status-dot.connected    { background: #5cb85c; }
  .status-dot.connecting   { background: #f0ad4e; }
  .status-dot.error        { background: #d9534f; }

  /* ── Subbar (second row, U4+U5) ──────────────────────────── */
  #subbar {
    background: #1e1e1e;
    border-bottom: 1px solid #333;
    padding: 6px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    font-size: 12px;
  }
  #subbar-worlds {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #subbar-auth {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
  }
  #subbar-worlds .wb-header {
    font-size: 13px;
    font-weight: 600;
    color: #a78bfa;
  }
  #subbar-worlds .wb-create {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  #subbar-worlds .wb-create input {
    background: #111;
    border: 1px solid #333;
    border-radius: 4px;
    color: #e2e8f0;
    padding: 4px 8px;
    font-size: 12px;
  }
  #subbar-worlds .wb-create input:focus { outline: none; border-color: #a78bfa; }
  #subbar-worlds .wb-create input#wb-slug { width: 120px; }
  #subbar-worlds .wb-create input#wb-name { width: 160px; }

  /* ── World browser ────────────────────────────────── */
  #world-browser {
    background: #161616;
    border-bottom: 1px solid #333;
    padding: 8px 12px;
    flex-shrink: 0;
    font-size: 12px;
  }
  #world-browser:empty { display: none; }

  .wb-header {
    font-size: 13px;
    font-weight: 600;
    color: #a78bfa;
    margin-bottom: 6px;
  }

  .wb-create {
    display: flex;
    gap: 6px;
    align-items: center;
    margin-bottom: 8px;
  }
  .wb-create input {
    background: #111;
    border: 1px solid #333;
    border-radius: 4px;
    color: #e2e8f0;
    padding: 4px 8px;
    font-size: 12px;
  }
  .wb-create input:focus { outline: none; border-color: #a78bfa; }
  .wb-create input#wb-slug { width: 120px; }
  .wb-create input#wb-name { width: 160px; }

  #wb-error {
    color: #f87171;
    font-size: 11px;
    margin-bottom: 6px;
  }
  #wb-error:empty { display: none; }

  .wb-list {
    max-height: 200px;
    overflow-y: auto;
  }
  .wb-list:empty::after {
    content: 'No worlds saved yet.';
    color: #64748b;
    font-style: italic;
    font-size: 11px;
  }

  .wb-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 0;
    border-bottom: 1px solid #222;
  }
  .wb-item:last-child { border-bottom: none; }

  .wb-item .wb-info {
    flex: 1;
    min-width: 0;
  }
  .wb-item .wb-info .wb-name {
    color: #e2e8f0;
    font-size: 12px;
  }
  .wb-item .wb-info .wb-meta {
    color: #64748b;
    font-size: 10px;
  }
  .wb-item button {
    font-size: 11px;
    padding: 3px 8px;
  }

  .wb-vis-toggle {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-size: 11px;
    color: #94a3b8;
    cursor: pointer;
    white-space: nowrap;
  }
  .wb-vis-toggle input[type="checkbox"] {
    width: 28px;
    height: 14px;
    appearance: none;
    -webkit-appearance: none;
    background: #475569;
    border-radius: 7px;
    position: relative;
    cursor: pointer;
    transition: background 0.2s;
    flex-shrink: 0;
  }
  .wb-vis-toggle input[type="checkbox"]::before {
    content: '';
    position: absolute;
    top: 2px;
    left: 2px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #e2e8f0;
    transition: transform 0.2s;
  }
  .wb-vis-toggle input[type="checkbox"]:checked {
    background: #22c55e;
  }
  .wb-vis-toggle input[type="checkbox"]:checked::before {
    transform: translateX(14px);
  }
  .wb-vis-toggle input[type="checkbox"]:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* ── Viewport (fills remaining space) ─────────────── */
  #viewport {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: #0a0a0a;
    cursor: default;
  }
  #viewport canvas {
    display: block;
    width: 100% !important;
    height: 100% !important;
  }

  /* ── HUD — top-left world info ─────────────────────── */
  #hud {
    position: absolute;
    top: 10px;
    left: 12px;
    background: rgba(0, 0, 0, 0.5);
    color: #fff;
    font-size: 12px;
    font-family: 'Cascadia Code', 'Fira Code', monospace;
    padding: 7px 12px;
    border-radius: 6px;
    pointer-events: none;
    line-height: 1.8;
    min-width: 180px;
  }
  #hud div:empty { display: none; }

  /* ── Overlay — transient load/error status ────────── */
  #overlay {
    position: absolute;
    bottom: 30px;
    left: 12px;
    font-size: 11px;
    color: #64748b;
    pointer-events: none;
    font-family: 'Cascadia Code', 'Fira Code', monospace;
    line-height: 1.6;
  }

  /* ── Teleporter failure panel (U2) ───────────────────────── */
  #tp-fail-panel {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.85);
    border: 1px solid #444;
    border-radius: 8px;
    padding: 12px;
    font-size: 12px;
    z-index: 10;
    max-width: 420px;
    width: max-content;
  }
  #tp-fail-panel .tp-fail-buttons {
    display: flex;
    gap: 6px;
    margin-top: 8px;
  }

  /* ── HUD hint — persistent controls hint, bottom-left  */
  #hud-hint {
    position: absolute;
    bottom: 10px;
    left: 12px;
    font-size: 11px;
    color: #64748b;
    pointer-events: none;
    font-family: 'Cascadia Code', 'Fira Code', monospace;
    line-height: 1.6;
  }

  #crosshair {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 16px; height: 16px;
    pointer-events: none;
    opacity: 0.5;
  }
  #crosshair::before, #crosshair::after {
    content: '';
    position: absolute;
    background: #fff;
  }
  #crosshair::before { width: 2px; height: 100%; left: 50%; transform: translateX(-50%); }
  #crosshair::after  { height: 2px; width: 100%; top: 50%; transform: translateY(-50%); }

  /* ── Drag-and-drop indicator ───────────────────────── */
  #viewport.drag-over {
    outline: 3px dashed #4a9eff;
    outline-offset: -3px;
  }

  /* Pad label style (T13) */
  .pad-label {
    border-left: 2px solid #33d9b2 !important;
    background: rgba(0,0,0,0.7) !important;
    color: #33d9b2 !important;
  }
</style>

<!-- Import map: Three.js + glTF-Transform + AtriumClient -->
<script type="importmap">
{
  "imports": {
    "three":                            "https://esm.sh/three@0.163.0",
    "three/addons/":                    "https://esm.sh/three@0.163.0/addons/",
    "@gltf-transform/core":             "https://esm.sh/@gltf-transform/core@4.3.0",
    "@gltf-transform/extensions":       "https://esm.sh/@gltf-transform/extensions@4.3.0",
    "@gltf-transform/view":             "https://esm.sh/@gltf-transform/view@4.3.0?deps=three@0.163.0,@gltf-transform/core@4.3.0",
    "@atrium/som":                      "../../packages/som/src/index.js",
    "@atrium/protocol":                 "../../packages/protocol/src/index.js",
    "@atrium/client":                   "../../packages/client/src/AtriumClient.js",
    "@atrium/client/AvatarController":      "../../packages/client/src/AvatarController.js",
    "@atrium/client/NavigationController":  "../../packages/client/src/NavigationController.js",
    "@atrium/client/AnimationController":   "../../packages/client/src/AnimationController.js",
    "@atrium/renderer-three":               "../../packages/renderer-three/src/index.js",
    "@atrium/interaction":                  "../../packages/interaction/src/index.js"
  }
}
</script>
</head>
<body>

<!-- Toolbar (U4: top row — ATRIUM, File, World, connection) -->
<div class="toolbar">
  <h1>ATRIUM</h1>
  <span>File:</span>
  <input id="worldUrl" type="text" value="../../tests/fixtures/space.gltf" placeholder=".gltf or .atrium.json URL" />
  <button id="loadBtn" class="primary">Load</button>
  <span class="ws-label">World:</span>
  <input id="wsUrl" type="text" placeholder="wss://host/worlds/user/slug" style="width:180px" />
  <div class="status-dot" id="statusDot"></div>
  <button id="connectBtn">Connect</button>
  <select id="mode-switcher">
    <option value="WALK">Walk</option>
    <option value="ORBIT">Orbit</option>
  </select>
</div>

<!-- Subbar (U5: second row — My Worlds, auth, teleporter controls) -->
<div id="subbar">
  <div id="subbar-worlds" style="display:none">
    <div class="wb-header">My Worlds</div>
    <div class="wb-create">
      <input id="wb-slug" type="text" placeholder="slug" />
      <input id="wb-name" type="text" placeholder="World name" />
      <button id="wb-create-btn" class="primary">Create</button>
    </div>
  </div>
  <div id="subbar-auth">
    <div id="auth-logged-out">
      <input id="auth-username" type="text" placeholder="Username" style="width:110px" />
      <input id="auth-password" type="password" placeholder="Password" style="width:110px" />
      <!-- Honeypot: positioned off-screen, bots fill it, humans don't see it -->
      <input id="auth-website" type="text" name="website" tabindex="-1" autocomplete="off"
        style="position:absolute;left:-9999px;top:0;width:1px;height:1px" />
      <button id="auth-submit-btn" class="primary">Login</button>
      <button id="auth-toggle-btn" class="text-btn">Register</button>
      <span id="auth-error"></span>
    </div>
    <div id="auth-logged-in" style="display:none">
      <span id="auth-user-label"></span>
      <button id="auth-logout-btn">Logout</button>
    </div>
    <div class="toolbar-sep"></div>
    <button id="tp-place-btn" disabled title="Place a teleporter pad">Place Teleporter</button>
    <button id="tp-delete-btn" disabled title="Delete a teleporter pad">Delete</button>
    <button id="tp-cancel-btn" style="display:none">Cancel</button>
  </div>
</div>

<!-- World Browser (shown when logged in) -->
<div id="world-browser" style="display:none">
  <div id="wb-error"></div>
  <div class="wb-list" id="wb-list"></div>
</div>

<!-- Viewport -->
<div id="viewport">
  <div id="hud">
    <div id="hud-world"></div>
    <div id="hud-you"></div>
    <div id="hud-peers"></div>
  </div>
  <div id="overlay"></div>
  <div id="hud-hint"></div>
  <div id="crosshair"></div>
  <!-- Teleporter placement form (T5) -->
  <div id="tp-form" style="display:none;position:absolute;bottom:60px;left:12px;background:rgba(0,0,0,0.85);border:1px solid #444;border-radius:8px;padding:12px;font-size:12px;z-index:10;min-width:280px">
    <div style="margin-bottom:8px;color:#a78bfa;font-weight:600">Place Teleporter</div>
    <select id="tp-world-select" style="width:100%;background:#222;border:1px solid #444;color:#e2e8f0;padding:4px 8px;border-radius:4px;margin-bottom:6px">
      <option value="">-- Select your world --</option>
    </select>
    <input id="tp-dest-input" type="text" placeholder="Or enter a path or ws(s) URL" style="width:100%;background:#222;border:1px solid #444;color:#e2e8f0;padding:4px 8px;border-radius:4px;margin-bottom:6px" />
    <div id="tp-spawn-warn" style="color:#f0ad4e;font-size:11px;display:none;margin-bottom:6px">Visitors arrive here and will land on this pad.</div>
    <div id="tp-form-error" style="color:#f87171;font-size:11px;margin-bottom:6px;display:none"></div>
    <div style="display:flex;gap:6px">
      <button id="tp-save-btn" class="primary" disabled>Save</button>
      <button id="tp-form-cancel">Cancel</button>
    </div>
  </div>

  <!-- Teleporter failure panel (U2) -->
  <div id="tp-fail-panel" style="display:none">
    <div id="tp-fail-msg"></div>
    <div class="tp-fail-buttons">
      <button id="tp-fail-goback" class="primary">Go back</button>
      <button id="tp-fail-dismiss">Dismiss</button>
    </div>
  </div>
</div>

<script type="module" src="src/app.js"></script>
</body>
</html>
