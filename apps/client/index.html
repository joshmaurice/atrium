<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Atrium</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #111;
    color: #e2e8f0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Toolbar ───────────────────────────────────────── */
  .toolbar {
    background: #1e1e1e;
    border-bottom: 1px solid #333;
    padding: 7px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .toolbar h1 {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: #a78bfa;
    flex-shrink: 0;
  }

  .toolbar input[type="text"] {
    flex: 1;
    background: #111;
    border: 1px solid #333;
    border-radius: 4px;
    color: #e2e8f0;
    padding: 5px 10px;
    font-size: 13px;
  }
  .toolbar input[type="text"]:focus,
  .toolbar input[type="password"]:focus { outline: none; border-color: #a78bfa; }

  .toolbar input[type="password"] {
    background: #111;
    border: 1px solid #333;
    border-radius: 4px;
    color: #e2e8f0;
    padding: 5px 10px;
    font-size: 13px;
  }

  .toolbar .ws-label {
    font-size: 12px;
    color: #64748b;
    flex-shrink: 0;
  }

  button {
    background: #2d2d2d;
    border: 1px solid #444;
    border-radius: 4px;
    color: #e2e8f0;
    padding: 5px 12px;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.1s;
    flex-shrink: 0;
  }
  button:hover:not(:disabled) { background: #3a3a3a; }
  button:disabled { opacity: 0.4; cursor: default; }
  button.primary { background: #5b21b6; border-color: #7c3aed; }
  button.primary:hover:not(:disabled) { background: #6d28d9; }
  button.text-btn { background: none; border: none; color: #a78bfa; font-size: 11px; padding: 5px; }
  button.text-btn:hover { color: #c4b5fd; }
  button.danger { border-color: #dc2626; color: #fca5a5; }
  button.danger:hover:not(:disabled) { background: #450a0a; }

  .toolbar select {
    background: #2d2d2d;
    border: 1px solid #444;
    border-radius: 4px;
    color: #e2e8f0;
    padding: 5px 8px;
    font-size: 12px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .toolbar select:focus { outline: none; border-color: #a78bfa; }

  /* Toolbar separator */
  .toolbar-sep {
    width: 1px;
    height: 24px;
    background: #333;
    flex-shrink: 0;
  }

  /* Auth error message */
  #auth-error {
    font-size: 11px;
    color: #f87171;
    max-width: 200px;
    flex-shrink: 0;
  }
  #auth-error:empty { display: none; }

  /* Auth logged-in label */
  #auth-user-label {
    font-size: 12px;
    color: #a78bfa;
    flex-shrink: 0;
  }

  /* Status dot */
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #888;
    flex-shrink: 0;
  }
  .status-dot.connected    { background: #5cb85c; }
  .status-dot.connecting   { background: #f0ad4e; }
  .status-dot.error        { background: #d9534f; }

  /* ── World browser ────────────────────────────────── */
  #world-browser {
    background: #161616;
    border-bottom: 1px solid #333;
    padding: 8px 12px;
    flex-shrink: 0;
    font-size: 12px;
  }
  #world-browser:empty { display: none; }

  .wb-header {
    font-size: 13px;
    font-weight: 600;
    color: #a78bfa;
    margin-bottom: 6px;
  }

  .wb-create {
    display: flex;
    gap: 6px;
    align-items: center;
    margin-bottom: 8px;
  }
  .wb-create input {
    background: #111;
    border: 1px solid #333;
    border-radius: 4px;
    color: #e2e8f0;
    padding: 4px 8px;
    font-size: 12px;
  }
  .wb-create input:focus { outline: none; border-color: #a78bfa; }
  .wb-create input#wb-slug { width: 120px; }
  .wb-create input#wb-name { width: 160px; }

  #wb-error {
    color: #f87171;
    font-size: 11px;
    margin-bottom: 6px;
  }
  #wb-error:empty { display: none; }

  .wb-list {
    max-height: 200px;
    overflow-y: auto;
  }
  .wb-list:empty::after {
    content: 'No worlds saved yet.';
    color: #64748b;
    font-style: italic;
    font-size: 11px;
  }

  .wb-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 0;
    border-bottom: 1px solid #222;
  }
  .wb-item:last-child { border-bottom: none; }

  .wb-item .wb-info {
    flex: 1;
    min-width: 0;
  }
  .wb-item .wb-info .wb-name {
    color: #e2e8f0;
    font-size: 12px;
  }
  .wb-item .wb-info .wb-meta {
    color: #64748b;
    font-size: 10px;
  }
  .wb-item button {
    font-size: 11px;
    padding: 3px 8px;
  }

  /* ── Viewport (fills remaining space) ─────────────── */
  #viewport {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: #0a0a0a;
    cursor: default;
  }
  #viewport canvas {
    display: block;
    width: 100% !important;
    height: 100% !important;
  }

  /* ── HUD — top-left world info ─────────────────────── */
  #hud {
    position: absolute;
    top: 10px;
    left: 12px;
    background: rgba(0, 0, 0, 0.5);
    color: #fff;
    font-size: 12px;
    font-family: 'Cascadia Code', 'Fira Code', monospace;
    padding: 7px 12px;
    border-radius: 6px;
    pointer-events: none;
    line-height: 1.8;
    min-width: 180px;
  }
  #hud div:empty { display: none; }

  /* ── Overlay — transient load/error status ────────── */
  #overlay {
    position: absolute;
    bottom: 30px;
    left: 12px;
    font-size: 11px;
    color: #64748b;
    pointer-events: none;
    font-family: 'Cascadia Code', 'Fira Code', monospace;
    line-height: 1.6;
  }

  /* ── HUD hint — persistent controls hint, bottom-left  */
  #hud-hint {
    position: absolute;
    bottom: 10px;
    left: 12px;
    font-size: 11px;
    color: #64748b;
    pointer-events: none;
    font-family: 'Cascadia Code', 'Fira Code', monospace;
    line-height: 1.6;
  }

  #crosshair {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 16px; height: 16px;
    pointer-events: none;
    opacity: 0.5;
  }
  #crosshair::before, #crosshair::after {
    content: '';
    position: absolute;
    background: #fff;
  }
  #crosshair::before { width: 2px; height: 100%; left: 50%; transform: translateX(-50%); }
  #crosshair::after  { height: 2px; width: 100%; top: 50%; transform: translateY(-50%); }

  /* ── Drag-and-drop indicator ───────────────────────── */
  #viewport.drag-over {
    outline: 3px dashed #4a9eff;
    outline-offset: -3px;
  }
</style>

<!-- Import map: Three.js + glTF-Transform + AtriumClient -->
<script type="importmap">
{
  "imports": {
    "three":                            "https://esm.sh/three@0.163.0",
    "three/addons/":                    "https://esm.sh/three@0.163.0/addons/",
    "@gltf-transform/core":             "https://esm.sh/@gltf-transform/core@4.3.0",
    "@gltf-transform/extensions":       "https://esm.sh/@gltf-transform/extensions@4.3.0",
    "@gltf-transform/view":             "https://esm.sh/@gltf-transform/view@4.3.0?deps=three@0.163.0,@gltf-transform/core@4.3.0",
    "@atrium/som":                      "../../packages/som/src/index.js",
    "@atrium/protocol":                 "../../packages/protocol/src/index.js",
    "@atrium/client":                   "../../packages/client/src/AtriumClient.js",
    "@atrium/client/AvatarController":      "../../packages/client/src/AvatarController.js",
    "@atrium/client/NavigationController":  "../../packages/client/src/NavigationController.js",
    "@atrium/client/AnimationController":   "../../packages/client/src/AnimationController.js",
    "@atrium/renderer-three":               "../../packages/renderer-three/src/index.js",
    "@atrium/interaction":                  "../../packages/interaction/src/index.js"
  }
}
</script>
</head>
<body>

<!-- Toolbar -->
<div class="toolbar">
  <h1>ATRIUM</h1>
  <input id="worldUrl" type="text" value="../../tests/fixtures/space.gltf" placeholder=".gltf or .atrium.json URL" />
  <button id="loadBtn" class="primary">Load</button>
  <span class="ws-label">Server:</span>
  <input id="wsUrl" type="text" value="ws://localhost:3000" style="width:180px" />
  <div class="status-dot" id="statusDot"></div>
  <button id="connectBtn">Connect</button>
  <select id="mode-switcher">
    <option value="WALK">Walk</option>
    <option value="ORBIT">Orbit</option>
  </select>

  <!-- Auth -->
  <div class="toolbar-sep"></div>

  <div id="auth-logged-out">
    <input id="auth-username" type="text" placeholder="Username" style="width:110px" />
    <input id="auth-password" type="password" placeholder="Password" style="width:110px" />
    <button id="auth-submit-btn" class="primary">Login</button>
    <button id="auth-toggle-btn" class="text-btn">Register</button>
    <span id="auth-error"></span>
  </div>

  <div id="auth-logged-in" style="display:none">
    <span id="auth-user-label"></span>
    <button id="auth-logout-btn">Logout</button>
  </div>
</div>

<!-- World Browser (shown when logged in) -->
<div id="world-browser" style="display:none">
  <div class="wb-header">My Worlds</div>
  <div class="wb-create">
    <input id="wb-slug" type="text" placeholder="slug" />
    <input id="wb-name" type="text" placeholder="World name" />
    <button id="wb-create-btn" class="primary">Create</button>
  </div>
  <div id="wb-error"></div>
  <div class="wb-list" id="wb-list"></div>
</div>

<!-- Viewport -->
<div id="viewport">
  <div id="hud">
    <div id="hud-world"></div>
    <div id="hud-you"></div>
    <div id="hud-peers"></div>
  </div>
  <div id="overlay"></div>
  <div id="hud-hint"></div>
  <div id="crosshair"></div>
</div>

<script type="module" src="src/app.js"></script>
</body>
</html>
