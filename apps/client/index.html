<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Atrium</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #111;
    color: #e2e8f0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Toolbar ───────────────────────────────────────── */
  .toolbar {
    background: #1e1e1e;
    border-bottom: 1px solid #333;
    padding: 7px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .toolbar h1 {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: #a78bfa;
    flex-shrink: 0;
  }

  .toolbar input[type="text"] {
    flex: 1;
    background: #111;
    border: 1px solid #333;
    border-radius: 4px;
    color: #e2e8f0;
    padding: 5px 10px;
    font-size: 13px;
  }
  .toolbar input[type="text"]:focus,
  .toolbar input[type="password"]:focus { outline: none; border-color: #a78bfa; }

  .toolbar input[type="password"] {
    background: #111;
    border: 1px solid #333;
    border-radius: 4px;
    color: #e2e8f0;
    padding: 5px 10px;
    font-size: 13px;
  }

  .toolbar .ws-label {
    font-size: 12px;
    color: #64748b;
    flex-shrink: 0;
  }

  button {
    background: #2d2d2d;
    border: 1px solid #444;
    border-radius: 4px;
    color: #e2e8f0;
    padding: 5px 12px;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.1s;
    flex-shrink: 0;
  }
  button:hover:not(:disabled) { background: #3a3a3a; }
  button:disabled { opacity: 0.4; cursor: default; }
  button.primary { background: #5b21b6; border-color: #7c3aed; }
  button.primary:hover:not(:disabled) { background: #6d28d9; }
  button.text-btn { background: none; border: none; color: #a78bfa; font-size: 11px; padding: 5px; }
  button.text-btn:hover { color: #c4b5fd; }
  button.danger { border-color: #dc2626; color: #fca5a5; }
  button.danger:hover:not(:disabled) { background: #450a0a; }

  .toolbar select {
    background: #2d2d2d;
    border: 1px solid #444;
    border-radius: 4px;
    color: #e2e8f0;
    padding: 5px 8px;
    font-size: 12px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .toolbar select:focus { outline: none; border-color: #a78bfa; }

  /* Toolbar separator */
  .toolbar-sep {
    width: 1px;
    height: 24px;
    background: #333;
    flex-shrink: 0;
  }

  /* Auth error message */
  #auth-error {
    font-size: 11px;
    color: #f87171;
    max-width: 200px;
    flex-shrink: 0;
  }
  #auth-error:empty { display: none; }

  /* Auth logged-in label */
  #auth-user-label {
    font-size: 12px;
    color: #a78bfa;
    flex-shrink: 0;
  }

  /* signin-sync I4 — the sign-in notice line. It stands out (bordered
     highlight, plain words) and is visible without opening anything. It is a
     sibling of #auth-error, never inside it: the signed-in form hides
     #auth-error, and the notice must be readable while signed in too. */
  #auth-notice {
    font-size: 12px;
    color: #fcd34d;
    border: 1px solid #b45309;
    background: rgba(180, 83, 9, 0.18);
    border-radius: 4px;
    padding: 2px 8px;
    max-width: 460px;
    flex-shrink: 0;
  }
  #auth-notice:empty { display: none; }

  /* Status dot */
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #888;
    flex-shrink: 0;
  }
  .status-dot.connected    { background: #5cb85c; }
  .status-dot.connecting   { background: #f0ad4e; }
  .status-dot.error        { background: #d9534f; }

  /* ── Subbar (second row, U4+U5) ──────────────────────────── */
  #subbar {
    background: #1e1e1e;
    border-bottom: 1px solid #333;
    padding: 6px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    font-size: 12px;
  }
  #subbar-worlds {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #subbar-auth {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
  }
  #subbar-worlds .wb-header {
    font-size: 13px;
    font-weight: 600;
    color: #a78bfa;
  }
  #subbar-worlds .wb-create {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  #subbar-worlds .wb-create input {
    background: #111;
    border: 1px solid #333;
    border-radius: 4px;
    color: #e2e8f0;
    padding: 4px 8px;
    font-size: 12px;
  }
  #subbar-worlds .wb-create input:focus { outline: none; border-color: #a78bfa; }
  #subbar-worlds .wb-create input#wb-slug { width: 120px; }
  #subbar-worlds .wb-create input#wb-name { width: 160px; }

  /* ── World browser ────────────────────────────────── */
  #world-browser {
    background: #161616;
    border-bottom: 1px solid #333;
    padding: 8px 12px;
    flex-shrink: 0;
    font-size: 12px;
  }
  #world-browser:empty { display: none; }

  .wb-header {
    font-size: 13px;
    font-weight: 600;
    color: #a78bfa;
    margin-bottom: 6px;
  }

  .wb-create {
    display: flex;
    gap: 6px;
    align-items: center;
    margin-bottom: 8px;
  }
  .wb-create input {
    background: #111;
    border: 1px solid #333;
    border-radius: 4px;
    color: #e2e8f0;
    padding: 4px 8px;
    font-size: 12px;
  }
  .wb-create input:focus { outline: none; border-color: #a78bfa; }
  .wb-create input#wb-slug { width: 120px; }
  .wb-create input#wb-name { width: 160px; }

  #wb-error {
    color: #f87171;
    font-size: 11px;
    margin-bottom: 6px;
  }
  #wb-error:empty { display: none; }

  .wb-list {
    max-height: 200px;
    overflow-y: auto;
  }
  .wb-list:empty::after {
    content: 'No worlds saved yet.';
    color: #64748b;
    font-style: italic;
    font-size: 11px;
  }

  .wb-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 0;
    border-bottom: 1px solid #222;
  }
  .wb-item:last-child { border-bottom: none; }

  .wb-item .wb-info {
    flex: 1;
    min-width: 0;
  }
  .wb-item .wb-info .wb-name {
    color: #e2e8f0;
    font-size: 12px;
  }
  .wb-item .wb-info .wb-meta {
    color: #64748b;
    font-size: 10px;
  }
  .wb-item button {
    font-size: 11px;
    padding: 3px 8px;
  }

  .wb-vis-toggle {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-size: 11px;
    color: #94a3b8;
    cursor: pointer;
    white-space: nowrap;
  }
  .wb-vis-toggle input[type="checkbox"] {
    width: 28px;
    height: 14px;
    appearance: none;
    -webkit-appearance: none;
    background: #475569;
    border-radius: 7px;
    position: relative;
    cursor: pointer;
    transition: background 0.2s;
    flex-shrink: 0;
  }
  .wb-vis-toggle input[type="checkbox"]::before {
    content: '';
    position: absolute;
    top: 2px;
    left: 2px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #e2e8f0;
    transition: transform 0.2s;
  }
  .wb-vis-toggle input[type="checkbox"]:checked {
    background: #22c55e;
  }
  .wb-vis-toggle input[type="checkbox"]:checked::before {
    transform: translateX(14px);
  }
  .wb-vis-toggle input[type="checkbox"]:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* ── Viewport (fills remaining space) ─────────────── */
  #viewport {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: #0a0a0a;
    cursor: default;
  }
  #viewport canvas {
    display: block;
    width: 100% !important;
    height: 100% !important;
  }

  /* ── HUD — top-left world info ─────────────────────── */
  #hud {
    position: absolute;
    top: 10px;
    left: 12px;
    background: rgba(0, 0, 0, 0.5);
    color: #fff;
    font-size: 12px;
    font-family: 'Cascadia Code', 'Fira Code', monospace;
    padding: 7px 12px;
    border-radius: 6px;
    pointer-events: none;
    line-height: 1.8;
    min-width: 180px;
  }
  #hud div:empty { display: none; }

  /* ── Overlay — transient load/error status ────────── */
  #overlay {
    position: absolute;
    bottom: 30px;
    left: 12px;
    font-size: 11px;
    color: #64748b;
    pointer-events: none;
    font-family: 'Cascadia Code', 'Fira Code', monospace;
    line-height: 1.6;
  }

  /* ── Teleporter failure panel (U2) ───────────────────────── */
  #tp-fail-panel {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.85);
    border: 1px solid #444;
    border-radius: 8px;
    padding: 12px;
    font-size: 12px;
    z-index: 10;
    max-width: 420px;
    width: max-content;
  }
  #tp-fail-panel .tp-fail-buttons {
    display: flex;
    gap: 6px;
    margin-top: 8px;
  }

  /* ── HUD hint — persistent controls hint, bottom-left  */
  #hud-hint {
    position: absolute;
    bottom: 10px;
    left: 12px;
    font-size: 11px;
    color: #64748b;
    pointer-events: none;
    font-family: 'Cascadia Code', 'Fira Code', monospace;
    line-height: 1.6;
  }

  #crosshair {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 16px; height: 16px;
    pointer-events: none;
    opacity: 0.5;
  }
  #crosshair::before, #crosshair::after {
    content: '';
    position: absolute;
    background: #fff;
  }
  #crosshair::before { width: 2px; height: 100%; left: 50%; transform: translateX(-50%); }
  #crosshair::after  { height: 2px; width: 100%; top: 50%; transform: translateY(-50%); }

  /* ── scripting-4c — the transient activate notice, above the HUD hint ──
     No `display` here on purpose: the element starts hidden with an INLINE
     `display:none`, and app.js shows it by clearing that inline style. A
     stylesheet `display: none` would win over the cleared inline style and the
     notice could never appear. */
  #activate-notice {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    padding: 6px 12px;
    border-radius: 6px;
    background: rgba(15, 23, 42, 0.85);
    color: #e2e8f0;
    font-size: 12px;
    white-space: nowrap;
    pointer-events: none;
  }

  /* ── Drag-and-drop indicator ───────────────────────── */
  #viewport.drag-over {
    outline: 3px dashed #4a9eff;
    outline-offset: -3px;
  }

  /* ── Edit mode (Phase 3 step 1b-1) ─────────────────── */
  #edit-toggle-btn.active { background: #5b21b6; border-color: #7c3aed; }
  #edit-panel {
    position: absolute;
    top: 10px;
    right: 12px;
    width: 250px;
    background: rgba(0,0,0,0.85);
    border: 1px solid #444;
    border-radius: 8px;
    padding: 10px;
    font-size: 12px;
    z-index: 10;
    /* X5 (scripting-4b-2 round 7) — the panel scrolls. With the Behaviour
       section open it ran past the bottom of the window and its last controls
       could not be reached (§1.2 item 5). Its containing block is #viewport
       (position: relative), so 10 px top and bottom leave the full panel
       reachable; the wheel is contained, so scrolling to an end doesn't move
       the camera. */
    max-height: calc(100% - 20px);
    overflow-y: auto;
    overscroll-behavior: contain;
  }
  #edit-panel .ep-title { color: #a78bfa; font-weight: 600; margin-bottom: 8px; }
  #edit-panel .ep-buttons { display: flex; gap: 4px; margin-bottom: 6px; }
  #edit-panel .ep-buttons button { padding: 3px 8px; font-size: 11px; }
  #edit-panel .ep-buttons button.active { background: #5b21b6; border-color: #7c3aed; }
  #edit-panel .ep-snaps { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-bottom: 8px; color: #94a3b8; font-size: 11px; }
  #edit-panel .ep-snaps label { display: inline-flex; align-items: center; gap: 3px; cursor: pointer; }
  #edit-panel .ep-empty { color: #64748b; font-style: italic; }
  #edit-panel .ep-row { display: flex; align-items: center; gap: 4px; margin-bottom: 4px; }
  #edit-panel .ep-row > span { width: 58px; color: #94a3b8; flex-shrink: 0; }
  #edit-panel input[type="text"] {
    min-width: 0;
    flex: 1;
    background: #222;
    border: 1px solid #444;
    border-radius: 4px;
    color: #e2e8f0;
    padding: 3px 5px;
    font-size: 11px;
    font-family: 'Cascadia Code', 'Fira Code', monospace;
  }
  #edit-panel input[type="text"]:focus { outline: none; border-color: #a78bfa; }
  #edit-panel input[type="text"]:disabled { opacity: 0.5; }
  #edit-panel .ep-status { color: #94a3b8; font-size: 11px; min-height: 0; }
  #edit-panel .ep-status:empty { display: none; }
  #edit-panel .ep-label { color: #94a3b8; font-size: 11px; margin-bottom: 3px; }
  #edit-panel #ep-palette { flex-wrap: wrap; margin-bottom: 8px; }
  /* edit-polish-2 L2 — the destination form is a panel section now, not an
     absolutely-positioned box: it fits the panel's 250 px like the rest. */
  #edit-panel #tp-form { margin-bottom: 8px; }
  #edit-panel #tp-form .ep-title { margin-bottom: 6px; }
  #edit-panel #tp-form select,
  #edit-panel #tp-form input[type="text"] { min-width: 0; }
  #edit-panel #tp-form button { padding: 3px 8px; font-size: 11px; }
  #edit-panel #model-form { margin-bottom: 8px; }
  #edit-panel #model-form .ep-title { margin-bottom: 6px; }
  #edit-panel #model-form input[type="text"] { min-width: 0; }
  #edit-panel #model-form button { padding: 3px 8px; font-size: 11px; }
  #edit-panel #ep-model-url { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* library-sky Z2 — the Library grid: a panel section under the Add row, with
     a scrolling tile list grouped by category. */
  #edit-panel #library-grid { margin-bottom: 8px; }
  #edit-panel #library-tiles { max-height: 260px; overflow-y: auto; }
  #edit-panel #library-tiles .lg-category { font-size: 10px; color: #94a3b8; margin: 6px 0 3px; }
  #edit-panel #library-tiles .lg-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  #edit-panel #library-tiles .lg-tile {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 4px; background: #222; border: 1px solid #444; border-radius: 4px;
    color: #e2e8f0; font-size: 10px; cursor: pointer;
  }
  #edit-panel #library-tiles .lg-tile img { width: 100%; height: 52px; object-fit: contain; }
  #edit-panel #library-tiles .lg-tile:disabled { opacity: 0.45; cursor: default; }
  #edit-panel #library-tiles .lg-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
  #edit-panel #library-credit { font-size: 10px; color: #94a3b8; margin: 6px 0; }
  #edit-panel #library-credit a { color: #93c5fd; }
  #edit-panel #library-status { font-size: 11px; margin-bottom: 6px; }
  /* library-sky Z4 — the World row and its sky select. */
  #edit-panel #ep-sky-row select {
    width: 100%; background: #222; border: 1px solid #444; color: #e2e8f0;
    padding: 4px 8px; border-radius: 4px;
  }
  #edit-panel #ep-sky-status { font-size: 11px; color: #f87171; margin-bottom: 6px; }
  #edit-panel #ep-sky-retry { padding: 3px 8px; font-size: 11px; }
  /* scripting-4a round 3 (W3) — the clip select takes the rest of its row and
     shrinks instead of widening it: `min-width: 0` is what lets a flex item go
     below its content's intrinsic width, so a 300-character clip id is cut short
     by the control, and Play and Stop — on their own row below — stay inside the
     250px panel. The chosen id is shown in full by the select's `title`. */
  #edit-panel #ep-anim-row select {
    flex: 1 1 auto; min-width: 0; max-width: 100%;
    background: #222; border: 1px solid #444; color: #e2e8f0;
    padding: 4px 8px; border-radius: 4px;
  }
  #edit-panel .ep-actions { margin-top: 6px; margin-bottom: 0; }
  #edit-panel .ep-buttons button:disabled { opacity: 0.45; cursor: default; }
  #edit-panel .ep-buttons button.ep-danger:not(:disabled) { border-color: #7f1d1d; color: #fca5a5; }
  #edit-panel .ep-error { color: #f87171; font-size: 11px; margin-top: 6px; }
  #edit-panel .ep-error:empty { display: none; }

  /* Pad label style (T13) */
  .pad-label {
    border-left: 2px solid #33d9b2 !important;
    background: rgba(0,0,0,0.7) !important;
    color: #33d9b2 !important;
  }
</style>

<body>

<!-- Toolbar (U4: top row — ATRIUM, File, World, connection) -->
<div class="toolbar">
  <h1>ATRIUM</h1>
  <span>File:</span>
  <input id="worldUrl" type="text" value="../../tests/fixtures/space.gltf" placeholder=".gltf or .atrium.json URL" />
  <button id="loadBtn" class="primary">Load</button>
  <span class="ws-label">World:</span>
  <input id="wsUrl" type="text" placeholder="wss://host/worlds/user/slug" style="width:180px" />
  <div class="status-dot" id="statusDot"></div>
  <button id="connectBtn">Connect</button>
  <select id="mode-switcher">
    <option value="WALK">Walk</option>
    <option value="ORBIT">Orbit</option>
  </select>
</div>

<!-- Subbar (U5: second row — My Worlds, auth, teleporter controls) -->
<div id="subbar">
  <div id="subbar-worlds" style="display:none">
    <div class="wb-header">My Worlds</div>
    <div class="wb-create">
      <input id="wb-slug" type="text" placeholder="slug" />
      <input id="wb-name" type="text" placeholder="World name" />
      <button id="wb-create-btn" class="primary">Create</button>
    </div>
  </div>
  <div id="subbar-auth">
    <div id="auth-logged-out">
      <input id="auth-username" type="text" placeholder="Username" style="width:110px" />
      <input id="auth-password" type="password" placeholder="Password" style="width:110px" />
      <!-- Honeypot: positioned off-screen, bots fill it, humans don't see it -->
      <input id="auth-website" type="text" name="website" tabindex="-1" autocomplete="off"
        style="position:absolute;left:-9999px;top:0;width:1px;height:1px" />
      <button id="auth-submit-btn" class="primary">Login</button>
      <button id="auth-toggle-btn" class="text-btn">Register</button>
      <span id="auth-error"></span>
    </div>
    <div id="auth-logged-in" style="display:none">
      <span id="auth-user-label"></span>
      <button id="auth-logout-btn">Logout</button>
    </div>
    <!-- signin-sync I4 — the sign-in notice. Plain words, in the top bar,
         visible in both the signed-in and the signed-out state. -->
    <span id="auth-notice"></span>
    <div class="toolbar-sep"></div>
    <!-- edit-polish-2 (Z4): the toolbar's Place Teleporter and its Cancel are
         gone. A pad is added from the Edit panel's Teleporter button, moved
         with the handles and deleted with Delete, all in Edit mode. -->
    <button id="edit-toggle-btn" style="display:none" title="Move, rotate, scale and rename this world's objects">Edit</button>
  </div>
</div>

<!-- World Browser (shown when logged in) -->
<div id="world-browser" style="display:none">
  <div id="wb-error"></div>
  <div class="wb-list" id="wb-list"></div>
</div>

<!-- Viewport -->
<div id="viewport">
  <div id="hud">
    <div id="hud-world"></div>
    <div id="hud-you"></div>
    <div id="hud-peers"></div>
  </div>
  <div id="overlay"></div>
  <div id="hud-hint"></div>
  <!-- scripting-4c AC6 — the click notice. Empty and hidden until one is shown. -->
  <div id="activate-notice" style="display:none"></div>
  <div id="crosshair"></div>

  <!-- Edit mode panel (Phase 3 step 1b-1) -->
  <div id="edit-panel" style="display:none">
    <div class="ep-title">Edit</div>
    <!-- E8 (E-L6) — the host line. Empty until the server says who owns the role. -->
    <div class="ep-status" id="ep-host-status"></div>
    <div class="ep-buttons" id="ep-modes">
      <button data-mode="translate" class="active" title="Move">Move</button>
      <button data-mode="rotate" title="Rotate">Rotate</button>
      <button data-mode="scale" title="Scale">Scale</button>
      <button id="ep-space" title="Handle orientation for Move and Rotate">World</button>
    </div>
    <div class="ep-snaps">
      <label><input type="checkbox" id="ep-snap-grid" /> Grid 0.25 m</label>
      <label><input type="checkbox" id="ep-snap-angle" /> 15°</label>
      <label><input type="checkbox" id="ep-snap-scale" /> Scale 0.1</label>
    </div>
    <div class="ep-label">Add</div>
    <div class="ep-buttons" id="ep-palette">
      <button data-kind="cube" title="Add a 1 m cube in front of you">Cube</button>
      <button data-kind="plane" title="Add a 2 m × 2 m flat plane in front of you">Plane</button>
      <button data-kind="sphere" title="Add a 1 m sphere in front of you">Sphere</button>
      <button data-kind="cylinder" title="Add a 1 m cylinder in front of you">Cylinder</button>
      <button data-kind="ramp" title="Add a ramp in front of you, rising away from you">Ramp</button>
      <!-- edit-polish-2 (Z3, P2) — the Teleporter button, last in the Add row.
           It has NO data-kind: the palette handler above would throw on an
           unknown kind. It has its own handler and joins the palette's enable
           rule (`!blocked && modes.edit`). -->
      <button id="ep-teleporter" title="Add a teleporter pad in front of you">Teleporter</button>
      <!-- models-by-url (Z7, P8) — the Model button, last in the Add row. It
           has NO data-kind either: it has its own handler and joins the
           palette's enable rule (`!blocked && modes.edit`). -->
      <button id="ep-model" title="Add a model from a URL in front of you">Model</button>
      <!-- library-sky (Z2) — the Library button, last in the Add row. Like the
           Teleporter and Model buttons it has NO data-kind: it has its own
           handler and joins the palette's enable rule (`!blocked && modes.edit`).
           It is hidden when the catalog has no models. -->
      <button id="ep-library" title="Place a model from the Atrium library in front of you">Library</button>
    </div>
    <!-- library-sky (Z4) — the World row: one select for the sky every visitor
         sees. None, the catalog's skies, and a disabled "Custom" entry while the
         world's texture is not a catalog sky. Not undoable. -->
    <div class="ep-label">World</div>
    <div class="ep-row" id="ep-sky-row">
      <select id="ep-sky" title="Choose the sky every visitor sees"></select>
    </div>
    <div id="ep-sky-status" style="display:none"></div>
    <div style="display:flex;gap:6px;margin-bottom:6px">
      <button id="ep-sky-retry" style="display:none" title="Try the sky again">Retry</button>
    </div>
    <!-- The destination form (T5, edit-polish-2 L2/Z3) — the same element and
         ids, moved out of the viewport's bottom-left corner and into the panel
         right under the Add row, so it opens next to the button that opened it
         and hides with the panel. -->
    <div id="tp-form" style="display:none">
      <div class="ep-title" style="margin-bottom:6px">New teleporter</div>
      <select id="tp-world-select" style="width:100%;background:#222;border:1px solid #444;color:#e2e8f0;padding:4px 8px;border-radius:4px;margin-bottom:6px">
        <option value="">-- Select your world --</option>
      </select>
      <input id="tp-dest-input" type="text" placeholder="Or enter a path or ws(s) URL" style="width:100%;background:#222;border:1px solid #444;color:#e2e8f0;padding:4px 8px;border-radius:4px;margin-bottom:6px" />
      <div id="tp-spawn-warn" style="color:#f0ad4e;font-size:11px;display:none;margin-bottom:6px">Visitors arrive here and will land on this pad.</div>
      <div id="tp-form-error" style="color:#f87171;font-size:11px;margin-bottom:6px;display:none"></div>
      <div style="display:flex;gap:6px">
        <button id="tp-save-btn" class="primary" disabled>Save</button>
        <button id="tp-form-cancel">Cancel</button>
      </div>
    </div>
    <!-- models-by-url (Z7, L9/L12) — the Model form, in the panel under the Add
         row, as the destination form is. Only one of the two is open at a time
         (the form gate in the app). -->
    <div id="model-form" style="display:none">
      <div class="ep-title" style="margin-bottom:6px">New model</div>
      <input id="model-url-input" type="text" placeholder="https://host/model.glb or /models/model.glb" style="width:100%;background:#222;border:1px solid #444;color:#e2e8f0;padding:4px 8px;border-radius:4px;margin-bottom:6px" spellcheck="false" autocomplete="off" />
      <div id="model-privacy" style="color:#94a3b8;font-size:11px;margin-bottom:6px"></div>
      <div style="display:flex;gap:6px;align-items:center;margin-bottom:6px">
        <button id="model-check-btn">Check</button>
        <span id="model-status" style="font-size:11px;color:#94a3b8;display:none"></span>
      </div>
      <label id="model-pin-row" style="display:none;font-size:11px;margin-bottom:6px"><input type="checkbox" id="model-pin-check" /> Pin this version</label>
      <div id="model-form-error" style="color:#f87171;font-size:11px;margin-bottom:6px;display:none"></div>
      <div style="display:flex;gap:6px">
        <button id="model-save-btn" class="primary" disabled>Save</button>
        <button id="model-form-cancel">Cancel</button>
      </div>
    </div>
    <!-- library-sky (Z2) — the Library grid: a panel section under the Add row,
         as the destination and Model forms are. Tiles are built by app.js from
         the committed catalog; the app's form gate keeps only one open. -->
    <div id="library-grid" style="display:none">
      <div class="ep-title" style="margin-bottom:6px">Library</div>
      <div id="library-tiles"></div>
      <div id="library-credit"></div>
      <div id="library-status" style="display:none"></div>
      <div style="display:flex;gap:6px">
        <button id="library-cancel">Cancel</button>
      </div>
    </div>
    <!-- R1 — Undo and Redo in their own row, outside #ep-fields, so they stay
         visible with no selection (right after a delete). Edit mode alone
         shows this row; the ids are unchanged (Y5). -->
    <div class="ep-buttons ep-actions" id="ep-history">
      <button id="ep-undo" title="Nothing to undo">Undo</button>
      <button id="ep-redo" title="Nothing to redo">Redo</button>
    </div>
    <div class="ep-empty" id="ep-empty">Click an object to select it.</div>
    <div id="ep-fields" style="display:none">
      <div class="ep-row"><span>Name</span><input type="text" id="ep-name" spellcheck="false" autocomplete="off" /></div>
      <div class="ep-status" id="ep-name-status"></div>
      <!-- models-by-url (Z7, L11) — one read-only row for a selected model node:
           the URL (middle-truncated, full text in the title), whether it follows
           the URL or is pinned, and its status or reason. -->
      <div class="ep-row" id="ep-model-row" style="display:none"><span>Model</span>
        <span id="ep-model-url" title=""></span>
        <span id="ep-model-pinned" style="color:#94a3b8;font-size:11px;margin-left:4px"></span>
      </div>
      <div class="ep-status" id="ep-model-status"></div>
      <!-- scripting-4a (Z7, L7) — the clip controls for a selected model node:
           the clip select (the L8 ids), a Loop box, and TWO buttons, Play and
           Stop. app.js's model-animation-panel.js is the one writer of their
           text, their options and their disabled state; visitors never see the
           rows, because the panel is the owner's.

           W3 (round 3) — the label and the select keep one row and the three
           controls get a row of their own (#ep-anim-actions), aligned under the
           select by the same empty 58px label cell every other row uses. The
           250px panel is then never widened by a long clip id, and Play and Stop
           are always fully inside it. app.js shows and hides the two rows
           together. -->
      <div class="ep-row" id="ep-anim-row" style="display:none"><span>Animation</span>
        <select id="ep-anim-clip" aria-label="Clip"></select>
      </div>
      <div class="ep-row" id="ep-anim-actions" style="display:none"><span></span>
        <label id="ep-anim-loop-label" style="display:flex;align-items:center;gap:3px;font-size:11px">
          <input type="checkbox" id="ep-anim-loop" /> Loop
        </label>
        <button id="ep-anim-play" title="Play the chosen clip">Play</button>
        <button id="ep-anim-stop" title="Stop and return to the rest pose">Stop</button>
      </div>
      <div class="ep-status" id="ep-anim-status"></div>
      <!-- scripting-4b-2 (F9) — the Behaviour section. `behavior-form.js` is the
           one writer of everything inside it: the template select, the
           per-template parameter fields, Enabled, Save, Remove, the status line,
           the one-time Undo note and the node's own log lines. -->
      <div class="ep-row" id="ep-behavior-row" style="display:none"><span>Behaviour</span>
        <select id="ep-behavior-template" aria-label="Behaviour template"></select>
      </div>
      <div id="ep-behavior-params" style="display:none"></div>
      <!-- scripting-4b-2 r3 (T1) — the Behaviour section's ONE help element,
           the writer of the chosen template's help lines. `behavior-form.js`
           owns its text and its visibility (hidden when empty); app.js passes
           it to `createBehaviorForm` as `elements.hint`. -->
      <div class="ep-status" id="ep-behavior-hint" style="display:none;color:#94a3b8"></div>
      <div class="ep-buttons ep-actions" id="ep-behavior-actions" style="display:none">
        <button type="button" id="ep-behavior-enabled" title="Run or pause this behaviour">Enabled</button>
        <button type="button" id="ep-behavior-save" title="Save the behaviour">Save</button>
        <button type="button" id="ep-behavior-remove" class="ep-danger" title="Remove the behaviour">Remove</button>
      </div>
      <div class="ep-status" id="ep-behavior-status"></div>
      <div class="ep-status" id="ep-behavior-note" style="color:#94a3b8"></div>
      <details id="ep-behavior-log" style="display:none">
        <summary style="cursor:pointer;font-size:11px;color:#94a3b8">Log</summary>
        <div id="ep-behavior-log-lines" style="font-size:10px;color:#94a3b8;max-height:80px;overflow:auto"></div>
      </details>
      <!-- edit-polish-3 (Z7, L5a) — the spawn note: app.js's refreshSpawnNote() is
           the one writer of its text and its visibility, and it is hidden until a
           selected pad (or a group holding one) sits near the spawn point. The
           marker for DEV acceptance is this element's presence. -->
      <div class="ep-status" id="ep-spawn-note" style="display:none;color:#f0ad4e"></div>
      <div class="ep-row"><span>Position</span>
        <input type="text" data-field="translation" data-i="0" aria-label="Position x" />
        <input type="text" data-field="translation" data-i="1" aria-label="Position y" />
        <input type="text" data-field="translation" data-i="2" aria-label="Position z" />
      </div>
      <div class="ep-row"><span>Rotation°</span>
        <input type="text" data-field="rotation" data-i="0" aria-label="Rotation x, degrees" />
        <input type="text" data-field="rotation" data-i="1" aria-label="Rotation y, degrees" />
        <input type="text" data-field="rotation" data-i="2" aria-label="Rotation z, degrees" />
      </div>
      <div class="ep-row"><span>Scale</span>
        <input type="text" data-field="scale" data-i="0" aria-label="Scale x" />
        <input type="text" data-field="scale" data-i="1" aria-label="Scale y" />
        <input type="text" data-field="scale" data-i="2" aria-label="Scale z" />
      </div>
      <!-- scripting-4b-2 (F6, F-L8) — the Visible checkbox. It writes `visible`
           through the SAME edit tracker as every other node field (no second
           path), and it is disabled while a write to the node is in flight.
           Un-hiding by hand is what keeps a behaviour-hidden object reachable. -->
      <div class="ep-row"><span>Visible</span>
        <label style="display:flex;align-items:center;gap:5px;font-size:11px">
          <input type="checkbox" id="ep-visible" aria-label="Visible" /> Rendered
        </label>
      </div>
      <div class="ep-buttons ep-actions" id="ep-actions">
        <button id="ep-duplicate" title="Duplicate the selected object">Duplicate</button>
        <button id="ep-delete" class="ep-danger" title="Delete the selected object">Delete</button>
      </div>
    </div>
    <div class="ep-error" id="ep-error"></div>
  </div>

  <!-- Teleporter failure panel (U2) -->
  <div id="tp-fail-panel" style="display:none">
    <div id="tp-fail-msg"></div>
    <div class="tp-fail-buttons">
      <button id="tp-fail-goback" class="primary">Go back</button>
      <button id="tp-fail-dismiss">Dismiss</button>
    </div>
  </div>
</div>

<script type="module" src="src/app.js"></script>
</body>
</html>
